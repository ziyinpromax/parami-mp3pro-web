<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Parami Tube — ကြေညာမပါဘဲ YouTube</title>
<link rel="icon" href="logo.jpg">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; color: #eef; min-height: 100vh;
    background: radial-gradient(1200px 700px at 20% -10%, #1b1050 0%, transparent 60%),
                radial-gradient(1000px 600px at 110% 10%, #063a5e 0%, transparent 55%),
                linear-gradient(180deg, #070818 0%, #0a0a24 100%);
    background-attachment: fixed; }
  header { position: sticky; top: 0; z-index: 20; padding: 10px 12px 8px;
    background: rgba(7,8,24,.92); backdrop-filter: blur(8px); border-bottom: 1px solid #ffffff14; }
  .brand { font-size: 20px; font-weight: 800; background: linear-gradient(90deg,#22d3ee,#a78bfa);
    -webkit-background-clip: text; background-clip: text; color: transparent; margin-bottom: 8px; }
  .brand small { font-size: 11px; -webkit-text-fill-color: #8fa; opacity: .8; font-weight: 400; }
  .brand .ver { font-size: 10px; -webkit-text-fill-color: #7ee7fc; opacity: .85; font-weight: 700; letter-spacing: .4px; }
  .srow { display: flex; gap: 8px; }
  input[type=text] { flex: 1; padding: 11px 13px; border-radius: 999px; border: 1px solid #2dd4ee44;
    background: #ffffff10; color: #fff; font-size: 15px; outline: none; min-width: 0; }
  input[type=text]:focus { border-color: #22d3ee; }
  button.go { padding: 0 16px; border: 0; border-radius: 999px; font-size: 15px; font-weight: 700;
    color: #06121f; background: linear-gradient(90deg,#22d3ee,#a78bfa); cursor: pointer; }
  #suggest { display: none; margin-top: 8px; border-radius: 14px; overflow: hidden;
    border: 1px solid #ffffff1c; background: #0d0e28; }
  .sug { padding: 12px 14px; font-size: 14px; cursor: pointer; border-top: 1px solid #ffffff10;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sug:first-child { border-top: 0; }
  .sug:active { background: #ffffff12; }
  .sug small { color: #aab; margin-left: 6px; }
  .sug.search-row { color: #7ee7fc; font-weight: 600; }
  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 10px 12px 2px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; padding: 7px 14px; border-radius: 999px; border: 1px solid #2dd4ee55;
    background: #ffffff10; color: #cfe; font-size: 13px; cursor: pointer; }
  .chip.on { background: linear-gradient(90deg,#22d3ee,#a78bfa); color: #06121f; font-weight: 700; border: 0; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 6px 12px 44px; }
  .status { margin: 16px 2px; color: #9fb; opacity: .85; font-size: 14px; display: none; }
  .msg { margin: 16px 0; padding: 12px 14px; border-radius: 12px; background: #f43f5e18;
    border: 1px solid #f43f5e44; color: #fda4af; font-size: 14px; display: none; }
  .grid { display: flex; flex-direction: column; gap: 18px; margin-top: 12px; }
  .card { cursor: pointer; }
  .thumb { position: relative; border-radius: 14px; overflow: hidden; background: #111; }
  .thumb img { width: 100%; aspect-ratio: 16/9; object-fit: cover; display: block; }
  .dur { position: absolute; right: 8px; bottom: 8px; background: rgba(0,0,0,.8); color: #fff;
  .botno { position: absolute; left: 8px; bottom: 8px; background: rgba(0,0,0,.8); color: #fda4af; font-size: 11px; padding: 2px 7px; border-radius: 6px; border: 1px solid #f43f5e44; }
    font-size: 12px; padding: 2px 7px; border-radius: 6px; }
  .card .t { font-size: 15px; font-weight: 600; line-height: 1.4; margin-top: 8px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card .a { font-size: 13px; color: #aab; margin-top: 3px; }
  .back { display: inline-flex; align-items: center; gap: 6px; margin: 12px 0 4px; padding: 8px 14px;
    border-radius: 999px; border: 1px solid #2dd4ee55; background: #ffffff10; color: #cfe;
    font-size: 14px; cursor: pointer; }
  video { width: 100%; border-radius: 14px; background: #000; aspect-ratio: 16/9; margin-top: 8px; object-fit: contain; }
  video:fullscreen { width: 100%; height: 100%; aspect-ratio: auto; border-radius: 0; object-fit: contain; background: #000; }
  .ptitle { font-size: 17px; font-weight: 700; margin: 12px 2px 2px; line-height: 1.4; }
  .pauthor { color: #aab; font-size: 13px; margin: 0 2px 6px; }
  .qrow { display: flex; gap: 8px; align-items: center; margin: 10px 0 4px; flex-wrap: wrap; }
  .mp3link { margin-left: auto; color: #7ee7fc; font-size: 13px; text-decoration: none; }
  .sect { font-size: 15px; font-weight: 700; margin: 20px 2px 10px; }
  .rows { display: flex; flex-direction: column; gap: 10px; }
  .item { display: flex; gap: 12px; padding: 8px; border-radius: 14px; cursor: pointer;
    background: #ffffff08; border: 1px solid #ffffff14; }
  .item:active { background: #ffffff14; }
  .item img { width: 128px; height: 72px; object-fit: cover; border-radius: 10px; background: #111; flex: none; }
  .item .t { font-size: 14px; font-weight: 600; line-height: 1.35;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .item .a { font-size: 12px; color: #aab; margin-top: 4px; }
.card{position:relative}
.card.sel .thumb{outline:3px solid #22d3ee}
.card.sel .thumb::after{content:'✓';position:absolute;top:6px;left:6px;background:#22d3ee;color:#06121f;border-radius:50%;width:24px;height:24px;line-height:24px;text-align:center;font-weight:800;z-index:4}
.item.sel{outline:2px solid #22d3ee}.card .rm{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.7);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:50%;width:24px;height:24px;line-height:23px;text-align:center;font-size:12px;cursor:pointer;z-index:3}
</style>
</head>
<body>
<header>
  <div class="brand">📺 Parami Tube <small class="ver">version 1.1</small> <small>ကြေညာ မပါဘူး • ကိုယ်ပိုင်</small></div>
  <div class="srow">
    <input type="text" id="q" placeholder="ရှာရန် (သို့) YouTube link ထည့်ပါ" autocomplete="off">
    <button class="go" id="goBtn">ရှာ</button>
  </div>
  <div id="suggest"></div>
</header>

<div class="chips" id="chips">
  <span class="chip on" data-cat="home">အဓိက</span>
  <span class="chip" data-cat="music">🎵 သီချင်း</span>
  <span class="chip" data-cat="story">📖 ဇာတ်လမ်း</span>
  <span class="chip" data-cat="news">📰 သတင်း</span>
  <span class="chip" data-cat="funny">😂 ဟာသ</span>
  <span class="chip" data-cat="saved" id="chipSaved">💾 သိမ်းထားတာ</span>
</div>

<div class="wrap">
  <!-- HOME / SEARCH view -->
  <div id="viewHome">
    <div id="npBar" style="display:none;align-items:center;gap:10px;margin:10px 0;padding:10px 12px;border-radius:14px;background:#22d3ee1f;border:1px solid #2dd4ee55;cursor:pointer">
      <div id="npTitle" style="flex:1;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">🎧 Background play</div>
      <span id="npToggle" style="cursor:pointer;font-size:18px;padding:2px 8px">⏸</span>
      <span id="npStop" style="cursor:pointer;font-size:16px;padding:2px 8px">✖</span>
    </div>
    <div class="status" id="status"></div>
    <div class="msg" id="msg"></div>
    <div class="grid" id="grid"></div>
  </div>

  <!-- WATCH view -->
  <div id="viewWatch" style="display:none">
    <span class="back" id="backBtn">← ပြန်သွား</span>
    <video id="vid" controls playsinline></video>
    <audio id="aud" preload="auto" style="display:none"></audio>
    <div class="ptitle" id="ptitle"></div>
    <div class="pauthor" id="pauthor"></div>
    <div class="qrow">
      <span class="chip on" id="chipSd">360p</span>
      <span class="chip" id="chipHd">720p</span>
      <span class="chip" id="btnPrev">⏮ အရင်</span>
      <span class="chip" id="btnNext">⏭ နောက်</span>
      <span class="chip" id="btnBg">🎧 Background</span>
      <span class="chip" id="btnFs">⛶ Fullscreen</span>
      <span class="chip" id="btnSave">💾 Save</span>
      <a class="mp3link" href="./">🎵 အသံသာ → Parami Mp3 Pro</a>
    </div>
    <div class="status" id="wstatus" style="min-height:0;margin:6px 0"></div>
    <div class="msg" id="wmsg"></div>
    <div class="sect">ဆက် ကြည့်ရန်</div>
    <div class="rows" id="related"></div>
  </div>
</div>

<div id="selBar" style="display:none;position:fixed;left:10px;right:10px;bottom:12px;z-index:60;background:#12122e;border:1px solid #2dd4ee66;border-radius:16px;padding:10px 12px;align-items:center;gap:10px;box-shadow:0 8px 30px rgba(0,0,0,.55)">
  <div id="selInfo" style="flex:1;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">ရွေးထားတာ 0 ပုဒ်</div>
  <span class="chip on" id="btnToBot">🤖 To bot</span>
  <span class="chip" id="btnSelX">✖</span>
</div>

<script>
var DEFAULT_WORKER = 'https://parami-mp3.ylin59905.workers.dev';
function workerBase(){ try{ return (localStorage.getItem('mp3pro_worker')||DEFAULT_WORKER).replace(/\/+$/,''); }catch(e){ return DEFAULT_WORKER; } }
var W = workerBase();
var $ = function(id){ return document.getElementById(id); };
var curId = '', curHd = false, curCat = 'home', storeRetries = 0, curDur = 0, reStoreTried = false;
var queue = [], queueIdx = -1, lastGrid = [], relItems = [];
var bgMode = false, pendingSeek = 0, audioDeadId = '';
var autoClock = null, autoTries = 0;
var bgVia = '';
var audioUrlCache = {}, audioFetchBusy = {};
var videoUrlCache = {}, videoFetchBusy = {}, audFromMp4 = false, mp4AudDeadId = '';
var STORE_K = 'pm-store-7';
var savedList = [];
try { savedList = JSON.parse(localStorage.getItem('tube_saved') || '[]'); } catch(e){ savedList = []; }
if(!Array.isArray(savedList)) savedList = [];
function persistSaved(){ try { localStorage.setItem('tube_saved', JSON.stringify(savedList)); } catch(e){} }
function isSaved(id){ for(var i=0;i<savedList.length;i++){ if(savedList[i].id === id) return true; } return false; }
function updSaveChip(){ var b = $('btnSave'); if(!b || !curId) return; var on = isSaved(curId); b.className = 'chip' + (on ? ' on' : ''); b.textContent = on ? '✓ သိမ်းပြီး' : '💾 Save'; }
function showWStatus(t){ $('wstatus').textContent = t || ''; }
/* Playback source = a file stored on THIS site (GitHub Pages). The Worker
   fetches the video once and saves it into the repo; afterwards it plays
   straight from github.io — the host his browser can actually stream. */
var AUTO_WAITS = [20, 30, 45, 60, 75];
/* YouTube's bot wall opens and closes in minutes-long windows. Ride it
   out with escalating waits — each round is a fresh Worker invocation,
   i.e. a fresh egress dice roll — instead of dying after 2 rounds. */
function scheduleAutoRetry(id, prefix){
  if(autoTries >= AUTO_WAITS.length) return false;
  var wait = AUTO_WAITS[autoTries];
  autoTries++;
  showWStatus('');
  showWMsg(prefix + ' — ' + wait + ' စက္ကန့် နေ အလိုအလျောက် ပြန် စမ်းပါမယ် (' + autoTries + '/' + AUTO_WAITS.length + ')');
  autoClock = setTimeout(function(){ autoClock = null; if (curId === id && $('viewWatch').style.display !== 'none') prepareAndPlay(id); }, wait * 1000);
  return true;
}
function prepareAndPlay(id){
  showWMsg('');
  if(bgMode && audioDeadId !== id){ prepareAudio(id, 0); return; }
  var tries = 0;
  var bigMode = (curDur >= 600);
  function attempt(){
    tries++;
    showWStatus(tries === 1
      ? (bigMode ? 'ဖိုင်ကြီး — ပြင်ဆင်ချိန် ၁-၃ မိနစ် ကြာနိုင်ပါတယ်...' : 'ပြင်ဆင်နေပါတယ် — ပထမ အကြိမ် ဆို ခဏ စောင့်ပါ...')
      : 'ပြန် စမ်းနေပါတယ် (' + tries + '/3)...');
    fetch(W + (bigMode ? '/storebig' : '/store') + '?v=' + encodeURIComponent(id) + '&kind=video&hd=' + (curHd ? 1 : 0) + '&k=' + STORE_K)
      .then(function(r){ return r.json(); })
      .then(function(d){
        if (curId !== id) return;
        if (d && d.ok && d.url){
          showWStatus(d.cached ? '' : 'ပြင်ဆင်ပြီး — ဖွင့်နေပါတယ်...');
          if(autoClock){ clearTimeout(autoClock); autoClock = null; }
          var v = $('vid');
          try{ $('aud').pause(); }catch(e){}
          bgVia = bgMode ? 'video' : '';
          v.src = d.url;
          videoUrlCache[id] = d.url;
          setMediaSession(id);
          if(pendingSeek > 0){
            var ps = pendingSeek; pendingSeek = 0;
            v.addEventListener('loadedmetadata', function h(){ v.removeEventListener('loadedmetadata', h); try{ v.currentTime = Math.min(ps, (v.duration || ps) - 1); }catch(e){} });
          }
          v.play().catch(function(){});
          return;
        }
        var err = (d && d.error) ? String(d.error) : '';
        if (!bigMode && err.indexOf('ကြီးလွန်း') >= 0){ bigMode = true; tries = 0; attempt(); return; }
        if (tries < 3){ setTimeout(function(){ if (curId === id) attempt(); }, 4000); return; }
        if (scheduleAutoRetry(id, 'YouTube က အခု ခဏ ပိတ်ထားတယ်')) return;
        showWStatus('');
        showWMsg(err || 'ဒီ video ကို ပြင် မရပါ — ခဏနေ ပြန် စမ်းပါ');
      })
      .catch(function(){
        if (curId !== id) return;
        if (tries < 3){ setTimeout(function(){ if (curId === id) attempt(); }, 4000); return; }
        if (scheduleAutoRetry(id, 'အင်တာနက်/YouTube ခဏ ပိတ်နေတယ်')) return;
        showWStatus(''); showWMsg('အင်တာနက် စစ်ပြီး ပြန် စမ်းပါ');
      });
  }
  attempt();
}

function setMediaSession(id){
  try {
    if(!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: $('ptitle').textContent || 'Parami Tube',
      artist: $('pauthor').textContent || '',
      artwork: [{ src: 'https://i.ytimg.com/vi/' + id + '/hqdefault.jpg', sizes: '480x360', type: 'image/jpeg' }]
    });
    navigator.mediaSession.setActionHandler('previoustrack', function(){ $('btnPrev').onclick(); });
    navigator.mediaSession.setActionHandler('nexttrack', function(){ $('btnNext').onclick(); });
    navigator.mediaSession.setActionHandler('play', function(){ var a = (bgMode && bgVia === 'audio') ? $('aud') : $('vid'); a.play().catch(function(){}); });
    navigator.mediaSession.setActionHandler('pause', function(){ var a = (bgMode && bgVia === 'audio') ? $('aud') : $('vid'); a.pause(); });
  } catch(e){}
}

var audPrimed = false;
function primeAud(){
  if(audPrimed) return; audPrimed = true;
  var a = $('aud'); if(!a) return;
  try {
    a.src = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=';
    var pr = a.play();
    if(pr && pr.then) pr.then(function(){ try{ a.pause(); a.removeAttribute('src'); a.load(); }catch(e){} }, function(){});
  } catch(e){}
}
function useStoredAudio(id, url, seekTo, fromMp4){
  var a = $('aud');
  audFromMp4 = !!fromMp4;
  a.src = url;
  bgVia = 'audio';
  setMediaSession(id);
  var sk = seekTo;
  if(sk < 0){ sk = 0; try{ sk = $('vid').currentTime || 0; }catch(e){} }
  a.addEventListener('loadedmetadata', function h(){
    a.removeEventListener('loadedmetadata', h);
    if(sk > 0){ try{ a.currentTime = Math.min(sk, (a.duration || sk) - 1); }catch(e){} }
  });
  var ppr = null;
  try{ ppr = a.play(); }catch(e){}
  if(ppr && ppr.then){
    ppr.then(function(){ showWStatus('🎧 Background play — screen ပိတ်ထားလို့ ရပါတယ်'); try{ $('vid').pause(); }catch(e){} prefetchNextAudio(); },
             function(){ var ae = $('aud'); ae.style.display = 'block'; ae.setAttribute('controls', ''); showWStatus('🎧 အသံ ရပြီ — အောက်က အသံ player မှာ ▶ နှိပ်ပါ (video လည်း ဆက် လာနေပါတယ်)'); });
  } else { showWStatus('🎧 Background play — screen ပိတ်ထားလို့ ရပါတယ်'); try{ $('vid').pause(); }catch(e){} prefetchNextAudio(); }
}
function nextQueueItem(){
  if(queueIdx >= 0 && queueIdx < queue.length - 1) return queue[queueIdx + 1];
  if(relItems && relItems.length) return relItems[0];
  return null;
}
/* while the current song plays in Background mode, quietly store the NEXT
   song's audio too — so 'ended' can switch instantly instead of waiting
   10-40s for a store (by then a hidden page's play() may be refused) */
function prefetchNextAudio(){
  if(!bgMode) return;
  var nx = nextQueueItem();
  if(!nx || !nx.id || nx.id === curId || audioUrlCache[nx.id] || audioFetchBusy[nx.id]) return;
  if(!videoUrlCache[nx.id] && !videoFetchBusy[nx.id]){
    videoFetchBusy[nx.id] = true;
    fetch(W + '/store?v=' + encodeURIComponent(nx.id) + '&kind=video&k=' + STORE_K)
      .then(function(r){ return r.json(); })
      .then(function(d){ videoFetchBusy[nx.id] = false; if(d && d.ok && d.url) videoUrlCache[nx.id] = d.url; })
      .catch(function(){ videoFetchBusy[nx.id] = false; });
  }
  audioFetchBusy[nx.id] = true;
  var big = (nx.duration || 0) >= 600;
  fetch(W + (big ? '/storebig' : '/store') + '?v=' + encodeURIComponent(nx.id) + '&kind=audio&k=' + STORE_K)
    .then(function(r){ return r.json(); })
    .then(function(d){ audioFetchBusy[nx.id] = false; if(d && d.ok && d.url) audioUrlCache[nx.id] = d.url; })
    .catch(function(){ audioFetchBusy[nx.id] = false; });
}
/* auto-advance: next in the tapped list, else fall back to the related
   rail (YouTube-style autoplay) — covers songs opened from a link or a
   suggestion row, which never set a queue */
function advanceNext(){
  if(queueIdx >= 0 && queueIdx < queue.length - 1){ playQueue(queueIdx + 1); return; }
  if(relItems && relItems.length){ queue = relItems.slice(); queueIdx = -1; playQueue(0); }
}
function prepareAudio(id, seekTo){
  if(audioUrlCache[id]){ useStoredAudio(id, audioUrlCache[id], seekTo, false); return; }
  if(videoUrlCache[id] && mp4AudDeadId !== id){ useStoredAudio(id, videoUrlCache[id], seekTo, true); return; }
  if(mp4AudDeadId === id){ audioStoreFlow(id, seekTo); return; }
  /* One file is enough (his point): background can play the mp4's own
     audio track. Probe the video store first — a hit (or one fresh
     store) gives background its file with NO second download; only
     when the video route fails do we fetch the audio-only file. */
  showWStatus('🎧 ပြင်ဆင်နေပါတယ်...');
  fetch(W + '/store?v=' + encodeURIComponent(id) + '&kind=video&hd=' + (curHd ? 1 : 0) + '&k=' + STORE_K)
    .then(function(r){ return r.json(); })
    .then(function(d){
      if(curId !== id) return;
      if(d && d.ok && d.url){ videoUrlCache[id] = d.url; useStoredAudio(id, d.url, seekTo, true); return; }
      audioStoreFlow(id, seekTo);
    })
    .catch(function(){ if(curId === id) audioStoreFlow(id, seekTo); });
}
function audioStoreFlow(id, seekTo){
  var tries = 0;
  showWStatus('🎧 အသံ ပြင်ဆင်နေပါတယ်...');
  (function attempt(){
    tries++;
    fetch(W + (curDur >= 600 ? '/storebig' : '/store') + '?v=' + encodeURIComponent(id) + '&kind=audio&k=' + STORE_K)
      .then(function(r){ return r.json(); })
      .then(function(d){
        if(curId !== id) return;
        if(d && d.ok && d.url){
          audioUrlCache[id] = d.url;
          useStoredAudio(id, d.url, seekTo, false);
          return;
        }
        if(tries < 3){ setTimeout(function(){ if(curId === id) attempt(); }, 4000); return; }
        audioDeadId = id;
        showWStatus('');
        bgMode = false; $('btnBg').className = 'chip';
        var vv = $('vid');
        if(vv && vv.src){ bgVia = 'video'; try{ vv.play().catch(function(){}); }catch(e){} showWStatus('🎧 Background (video) — အသံ သီးသန့် မရလို့ video အတိုင်း background မှာ ဆက် ဖွင့်ထားပါတယ် (data ပို သုံးပါမယ်)'); return; }
        showWMsg('ဒီ video အတွက် 🎧 Background play မရပါ — video အဖြစ် ပြန် ဖွင့်ပေးထားပါတယ်');
        prepareAndPlay(id);
      })
      .catch(function(){
        if(curId !== id) return;
        if(tries < 3){ setTimeout(function(){ if(curId === id) attempt(); }, 4000); return; }
        audioDeadId = id;
        showWStatus('');
        bgMode = false; $('btnBg').className = 'chip';
        var vv2 = $('vid');

function parseId(text){
  if(!text) return '';
  text = text.trim();
  var m = text.match(/(?:youtu\.be\/|[?&]v=|\/shorts\/|\/embed\/|\/live\/|\/v\/)([\w-]{11})/);
  if(m) return m[1];
  if(/^[\w-]{11}$/.test(text)) return text;
  return '';
}
function fmtDur(s){
  s = Math.max(0, Math.floor(s||0));
  var h = Math.floor(s/3600), m = Math.floor((s%3600)/60), ss = s%60;
  var mm = h>0 && m<10 ? '0'+m : ''+m;
  return (h>0 ? h+':' : '') + mm + ':' + (ss<10?'0':'') + ss;
}

/* --- multi-select + To bot -------------------------------------------
   Long-press (hold >550ms) a card/row to enter select mode; taps then
   toggle picks (max 30). 'To bot' walks the picks and stores each song
   (video + audio) through the BOT route (/store?to=tg): the media is
   downloaded cloud-side and posted into his Telegram channel — the
   visitor's phone only sends tiny requests, never the media itself.
   Long items (>=600s) go through the big-file B2 route instead. */
var selMode = false, selMap = {}, botRunning = false;
function selCount(){ return Object.keys(selMap).length; }
function updSelBar(){
  var b = $('selBar'); if(!b) return;
  if(selMode){ b.style.display = 'flex'; if(!botRunning) $('selInfo').textContent = 'ရွေးထားတာ ' + selCount() + ' ပုဒ်'; }
  else b.style.display = 'none';
}
/* The bot route serves files back from Telegram, which caps playback
   at ~19.5 MB — and live/unknown-length streams cannot be downloaded
   at all. Long items (>=10 min) and no-duration items are therefore
   NOT bot-selectable (they still play normally in Tube via B2). */
function botSelectable(it){
  var d = (it && it.duration) || 0;
  return d > 0 && d < 600;
}
function toggleSel(it, el){
  if(!botSelectable(it) && !selMap[it.id]) return;
  if(selMap[it.id]){ delete selMap[it.id]; el.classList.remove('sel'); }
  else {
    if(selCount() >= 30){ showMsg('အများဆုံး 30 ပုဒ် ပဲ ရွေးလို့ ရပါတယ်'); return; }
    selMap[it.id] = it; el.classList.add('sel');
  }
  if(selCount() === 0) selMode = false;
  updSelBar();
}
function clearSel(){
  selMap = {}; selMode = false;
  document.querySelectorAll('.sel').forEach(function(e){ e.classList.remove('sel'); });
  updSelBar();
}
function bindSel(el, it, openFn){
  /* Long-press must fire from a TIMER on pointerdown: on Android Chrome
     a long hold swallows the release click, so measuring the hold at
     click time never engaged selection at all. */
  var timer = null, lpFired = false, sx = 0, sy = 0;
  function clearT(){ if(timer){ clearTimeout(timer); timer = null; } }
  el.addEventListener('pointerdown', function(e){
    lpFired = false;
    sx = e.clientX || 0; sy = e.clientY || 0;
    clearT();
    timer = setTimeout(function(){
      timer = null; lpFired = true;
      if(!botSelectable(it)) return;
      if(!selMode) selMode = true;
      try{ if(navigator.vibrate) navigator.vibrate(30); }catch(err){}
      toggleSel(it, el);
    }, 550);
  });
  el.addEventListener('pointermove', function(e){
    if(Math.abs((e.clientX || 0) - sx) > 10 || Math.abs((e.clientY || 0) - sy) > 10) clearT();
  });
  el.addEventListener('pointerup', clearT);
  el.addEventListener('pointercancel', clearT);
  el.addEventListener('contextmenu', function(e){ e.preventDefault(); });
  el.onclick = function(){
    if(lpFired){ lpFired = false; return; }
    if(selMode){ toggleSel(it, el); return; }
    openFn();
  };
}

/* --- type-ahead suggestions: as he types, matching song/video names drop
   down (served by the same /search the results page uses); tapping a name
   plays it directly, tapping the first row searches the text --- */
var sugTimer = null, sugSeq = 0;
function hideSuggest(){ var b=$('suggest'); b.style.display='none'; b.innerHTML=''; }
function renderSuggest(v, items){
  var box = $('suggest'); box.innerHTML = '';

  head.className = 'sug search-row';

  box.appendChild(head);
  items.slice(0, 7).forEach(function(it){
    var row = document.createElement('div');
    row.className = 'sug';
    row.textContent = '🎵 ' + (it.title || '');
    if(it.author){ var sm = document.createElement('small'); sm.textContent = it.author; row.appendChild(sm); }
    row.onclick = function(){ hideSuggest(); $('q').value = it.title || ''; openWatch(it.id, it.title, it.author, false, it.duration); };
    box.appendChild(row);
  });
  box.style.display = 'block';
}
$('q').addEventListener('input', function(){
  var v = $('q').value.trim();

  if(!v || parseId(v)){ hideSuggest(); return; }
  sugTimer = setTimeout(function(){
    var seq = ++sugSeq;
    fetch(W + '/search?q=' + encodeURIComponent(v)).then(function(r){ return r.json(); }).then(function(d){
      if(seq !== sugSeq || !d || !d.ok) return;
      renderSuggest(v, d.results || []);

});
$('q').addEventListener('blur', function(){ setTimeout(hideSuggest, 250); });

$('btnSelX').onclick = function(){ if(!botRunning) clearSel(); };
$('btnToBot').onclick = async function(){
  if(botRunning) return;
  var items = Object.keys(selMap).map(function(k){ return selMap[k]; }).filter(function(it){ return botSelectable(it); });
  if(!items.length) return;
  botRunning = true;
  var total = items.length, done = 0, okN = 0;
  $('btnToBot').textContent = '⏳ 0/' + total;
  for(var i = 0; i < items.length; i++){
    var it = items[i];
    $('selInfo').textContent = '🤖 ဒေါင်းနေပါတယ် ' + (i + 1) + '/' + items.length + ' — ' + (it.title || it.id);
    /* video only — background play reads the mp4's audio track, so a
       second audio download is wasted time and storage */
    try {
      var u = (it.duration >= 600)
        ? W + '/storebig?v=' + encodeURIComponent(it.id) + '&kind=video&k=' + STORE_K
        : W + '/store?v=' + encodeURIComponent(it.id) + '&kind=video&to=tg&k=' + STORE_K;
      var d = await fetch(u).then(function(r){ return r.json(); });
      if(d && d.ok) okN++;
    } catch(e){}
    done++;
    $('btnToBot').textContent = '⏳ ' + done + '/' + total;
  }
  botRunning = false;
  $('btnToBot').textContent = '🤖 To bot';
  $('selInfo').textContent = '✅ ပြီးပါပြီ — ' + okN + '/' + total + ' ပုဒ် pool ထဲ ရောက်ပါပြီ';
  selMap = {}; selMode = false;
  document.querySelectorAll('.sel').forEach(function(e){ e.classList.remove('sel'); });
  setTimeout(updSelBar, 5000);
};

loadFeed('home');
</script>
